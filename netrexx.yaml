filetype: netrexx

detect:
    filename: "(\\.nrx$|\\.njp$)"

rules:

    # operators - eleven basic symbols but multiple combinations.
    - symbol.operator: ([+*|=\\%]|<|>|/|-|&)
    - symbol.brackets: "[(){}]|\\[|\\]"
    # other symbols
    - symbol: ([.:;,])

    # boolean - NetRexx uses 1 and 0; 'true' and 'false' can be defined by variables though.

    # numbers
    - constant.number: "\\b[+-]?([0-9]+(\\.[0-9]+)?|\\.[0-9]+|\\.)([eE][+-]?[0-9]+)?\\b"

    # binary
    - constant.number: "\\b(([0-9])+([bB])+([0-1]+))\\b"

    # hex
    - constant.number: "\\\\x[A-Fa-f0-9]{2}"
    - constant.number: "\\b(([0-9])+([xX])+([A-Fa-f0-9]+))\\b"

    # escape sequences - NetRexx does not had \b; added \0 for null
    - constant.escape: "\\\\([tnrf]|'|\\\"|\\\\|\0)"

    # unicode
    - constant.specialChar: "\\\\u[A-Fa-f0-9]{4}"

    # strings using double quote character
    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."

    #  strings using single quote character
    - constant.string:
        start: "'"
        end: "'"
        skip: "\\\\."

    # keywords related to program flow
    - statement: "\\b(exit|iterate|leave|return|signal)\\b"

    # keywords that appear before first class or statement
    - statement: "(?i)\\b(import|options|package)\\b"

    # option parameters
    - statement.parameter: "(?i)\\b(binary|nobinary)\\b"
    - statement.parameter: "(?i)\\b(comments|nocomments)\\b"
    - statement.parameter: "(?i)\\b(compact|nocompact)\\b"
    - statement.parameter: "(?i)\\b(console|noconsole)\\b"
    - statement.parameter: "(?i)\\b(crossref|nocrossref)\\b"
    - statement.parameter: "(?i)\\b(decimal|nodecimal)\\b"
    - statement.parameter: "(?i)\\b(diag|nodiag)\\b"
    - statement.parameter: "(?i)\\b(explicit|noexplicit)\\b"
    - statement.parameter: "(?i)\\b(format|noformat)\\b"
    - statement.parameter: "(?i)\\b(java|nojava)\\b"
    - statement.parameter: "(?i)\\b(logo|nologo)\\b"
    - statement.parameter: "(?i)\\b(replace|noreplace)\\b"
    - statement.parameter: "(?i)\\b(savelog|nosavelog)\\b"
    - statement.parameter: "(?i)\\b(sourcedir|nosourcedir)\\b"
    - statement.parameter: "(?i)\\b(strictargs|nostrictargs)\\b"
    - statement.parameter: "(?i)\\b(strictassign|nostrictassign)\\b"
    - statement.parameter: "(?i)\\b(strictcase|nostrictcase)\\b"
    - statement.parameter: "(?i)\\b(strictimport|nostrictimport)\\b"
    - statement.parameter: "(?i)\\b(strictprops|nostrictprops)\\b"
    - statement.parameter: "(?i)\\b(strictsignal|nostrictsignal)\\b"
    - statement.parameter: "(?i)\\b(symbols|nosymbols)\\b"
    - statement.parameter: "(?i)\\b(trace|trace1|trace2|notrace)\\b"
    - statement.parameter: "(?i)\\b(utf8|noutf8)\\b"
    - statement.parameter: "(?i)\\b(verbose|verbose0)\\b"
    - statement.parameter: "(?i)\\b(verbose1|verbose2)\\b"
    - statement.parameter: "(?i)\\b(verbose3|verbose4)\\b"
    - statement.parameter: "(?i)\\b(verbose5|noverbose)\\b"
    - statement.parameter: "(?i)\\b(annotate|noannotate)\\b"
    - statement.parameter: "(?i)\\b(deps|nodeps)\\b"
    - statement.parameter: "(?i)\\b(mod|nomod)\\b"
    - statement.parameter: "(?i)\\b(implicituses|noimplicituses)\\b"
    - statement.parameter: "(?i)\\b(compile|nocompile)\\b"
    - statement.parameter: "(?i)\\b(keep|nokeep)\\b"
    - statement.parameter: "(?i)\\b(time|notime)\\b"

    # give color to class names; later reset class to default statement color
    - identifier.class: "class +[A-Za-z_][A-Za-z0-9_]* *((implements|extends) +[A-Za-z0-9._]+)?"

    # properties
    - statement: "(?i)\\b(properties)\\b"

    # visibility & modifiers
    - statement: "(?i)\\b(abstract|constant|final|indirect|inheritable|native|private|public|shared|static)\\b"
    - statement: "(?i)\\b(protect)\\b"
    - statement: "(?i)\\b(binary|nobinary|decimal|nodecimal)\\b"
    - statement: "(?i)\\b(signals|returns)\\b"
    
    # property-specific modifiers
    - statement: "(?i)\\b(transient|volatile)\\b"
    
    # class-specific modifier
    - statement: "(?i)\\b(adapter)\\b"

    # give color to method names; later reset method to default statement color
    - identifier.method: "method +[A-Za-z_][A-Za-z0-9_]*"

    # builtin-functions
    - statement.built_in: "(?i)\\b(abbrev|abs|b2d|b2x|c2d|c2x|center|centre)\\b"
    - statement.built_in: "(?i)\\b(changestr|compare|copies|copyindexed)\\b"
    - statement.built_in: "(?i)\\b(countstr|d2b|d2c|d2x|datatype|delstr)\\b"
    - statement.built_in: "(?i)\\b(delword|exists|format|insert|lastpos|left)\\b"
    - statement.built_in: "(?i)\\b(length|lower|max|min|overlay|pos)\\b"
    - statement.built_in: "(?i)\\b(reverse|right|sequence|sign|space|strip)\\b"
    - statement.built_in: "(?i)\\b(substr|subword|translate|trunc|upper)\\b"
    - statement.built_in: "(?i)\\b(verify|word|wordindex|wordlength)\\b"
    - statement.built_in: "(?i)\\b(wordpos|words|x2b|x2c|x2d|value|rxfuncquery)\\b"
    - statement.built_in: "(?i)\\b(date|time|random|queued|stream|symbol)\\b"
    - statement.built_in: "(?i)\\b(address|arg|condition|sourceline|trace)\\b"
    - statement.built_in: "(?i)\\b(bitand|bitor|bitxor|justify|xrange)\\b"
    - statement.built_in: "(?i)\\b(digits|form|fuzz|linesize)\\b"
    - statement.built_in: "(?i)\\b(rxfuncadd|rxfuncdrop)\\b"
    - statement.built_in: "(?i)\\b(charin|charout|chars|close|linein|lineout|lines)\\b"
    - statement.built_in: "(?i)\\b(fdopen|fileno|ftell|open|pclose|popen)\\b"

    # Rexx arithmetic methods
    - statement.built_in: "(?i)\\b(OpAdd|OpAnd|OpCc|OpCcblank|OpDiv|OpDivI)\\b"
    - statement.built_in: "(?i)\\b(OpEq|OpEqS|OpGt|OpGtEq|OpGtEqS|OpGtS|OpLt)\\b"
    - statement.built_in: "(?i)\\b(OpLtEq|OpLtEqS|OpLtS|OpMinus|OpMult|OpNot|OpNotEq)\\b"
    - statement.built_in: "(?i)\\b(OpNotEqS|OpOr|OpPlus|OpPow|OpRem|OpSub|OpXor)\\b"

    # Rexx miscellaneous methods
    - statement.built_in: "(?i)\\b(charAt|equals|hashCode|toboolean|tobyte)\\b"
    - statement.built_in: "(?i)\\b(toByteArray|tochar|toCharArray|todouble|tofloat)\\b"
    - statement.built_in: "(?i)\\b(toint|tolong|toRexx|toshort|toString)\\b"

    # RexxIO
    - statement: "(?i)\\b(RexxIO|Ask|AskOne|Say|File|forEachline|RexxChannel)\\b"
    - statement: "(?i)\\b(popOutputStream|pushOutputStream|setOutputStream)\\b"

    # RexxSet digits|form
    - statement: "(?i)\\b(RexxSet|formword|setDigits|setForm)\\b"
    - statement: "(?i)\\b(DEFAULT_DIGITS|DEFAULT_FORM|ENGINEERING|SCIENTIFIC)\\b"

    # Exceptions
    - type: "(?i)\\b(BadArgumentException|BadColumnException)\\b"
    - type: "(?i)\\b(BadNumericException|DivideException)\\b"
    - type: "(?i)\\b(ExponentOverflowException|NoOtherwiseException)\\b"
    - type: "(?i)\\b(NotCharacterException|NotLogicException)\\b"
    - type: "(?i)\\b(ArithmeticException|IOException|FileNotFoundException)\\b"
    - type: "(?i)\\b(IllegalArgumentException|IllegalStateException|InterruptedException)\\b"
    - type: "(?i)\\b(NullPointerException|NumberFormatException)\\b"

    # modifiers
    - type.keyword: "(?i)\\b(abstract|adapter|binary|dependent)\\b"
    - type.keyword: "(?i)\\b(deprecated|extends|final|implements|interface)\\b"
    - type.keyword: "(?i)\\b(native|protect|returns|signals|transient)\\b"
    - type.keyword: "(?i)\\b(unused|uses|volatile|constant)\\b"

    # data types
    - type: "(?i)\\b(boolean|byte|char|double|float)\\b"
    - type: "(?i)\\b(int|long|short|Rexx|String|void)\\b"

    # special names
    - special: "(?i)\\b(ask|class|digits|form|length|null|source)\\b"
    - special: "(?i)\\b(sourceline|super|this|trace|version)\\b"

    # keywords
    # re-color class/method from above
    - statement: "(?i)\\b(class|method|do|if|loop|nop|numeric)\\b"
    - statement: "(?i)\\b(parse|properties|say|select|arg|pull|value)\\b"
    - statement: "(?i)\\b(catch|else|end|finally|otherwise|then|when)\\b"
    - statement: "(?i)\\b(address|interpret|procedure)\\b"
    - statement: "(?i)\\b(use|go)\\b"

    # sub-keywords
    - statement: "(?i)\\b(all|by|engineering|for|forever)\\b"
    - statement: "(?i)\\b(label|methods|off|over|results|scientific)\\b"
    - statement: "(?i)\\b(to|until|var|while|upper|lower)\\b"

    # pipe
    - statement: "(?i)\\b(pipe)\\b"

    # pipe stages
    - statement.built_in: "(?i)\\b(_rexx|_string|_vector|abbrev|abbrevi|abbrevia)\\b"
    - statement.built_in: "(?i)\\b(abbreviat|abbreviati|abbreviatio|abbreviation)\\b"
    - statement.built_in: "(?i)\\b(aggrc|append|array|arraya|arrayr|arrayw|between)\\b"
    - statement.built_in: "(?i)\\b(buffer|casei|change|chop|cmd|command|comment)\\b"
    - statement.built_in: "(?i)\\b(compare|cons|conso|consol|console|copy|count|dam)\\b"
    - statement.built_in: "(?i)\\b(deal|deblock|dict|dicta|dictr|dictw|disk|diska)\\b"
    - statement.built_in: "(?i)\\b(diskr|diskslow|diskw|drop|dup|dupl|dupli|duplic)\\b"
    - statement.built_in: "(?i)\\b(duplica|duplicat|duplicate|elastic|fanin)\\b"
    - statement.built_in: "(?i)\\b(faninany|fanout|fblock|file|filea|filer|fileslow)\\b"
    - statement.built_in: "(?i)\\b(filew|find|frlabel|fromlabel|fromtarget|frtarget)\\b"
    - statement.built_in: "(?i)\\b(gate|gen|get|getf|getfi|getfil|getfile|getfiles)\\b"
    - statement.built_in: "(?i)\\b(getovers|getstems|hash|hasha|hashr|hashw|hole)\\b"
    - statement.built_in: "(?i)\\b(hostbyaddr|hostbyname|hostid|hostname|insert)\\b"
    - statement.built_in: "(?i)\\b(inside|join|joincont|juxtapose|listzip|literal)\\b"
    - statement.built_in: "(?i)\\b(locate|lookup|nfind|ninside|nlocate|noeofback)\\b"
    - statement.built_in: "(?i)\\b(not|notfind|notinside|notlocate|outside)\\b"
    - statement.built_in: "(?i)\\b(overl|overla|overlay|pad|pick|prefix|ptimer)\\b"
    - statement.built_in: "(?i)\\b(qsort|query|random|reverse|serialize|sort)\\b"
    - statement.built_in: "(?i)\\b(sortClass|sortRexx|space|spec|specs|split)\\b"
    - statement.built_in: "(?i)\\b(sqlselect|stem|stema|stemr|stemw|strfind)\\b"
    - statement.built_in: "(?i)\\b(strfrlab|strfrlabe|strfrlabel|strfromlabel)\\b"
    - statement.built_in: "(?i)\\b(strlit|strlite|strliter|strlitera|strliteral)\\b"
    - statement.built_in: "(?i)\\b(strnfind|strtolab|strtolabe|strtolabel|take)\\b"
    - statement.built_in: "(?i)\\b(tcpclient|tcpdata|tcplisten|term|termi|termin)\\b"
    - statement.built_in: "(?i)\\b(termina|terminal|timestamp|tokenise|tokenize)\\b"
    - statement.built_in: "(?i)\\b(tolabel|totarget|trans|transl|transla|translat)\\b"
    - statement.built_in: "(?i)\\b(translate|truncate|unique|unzip|varover)\\b"
    - statement.built_in: "(?i)\\b(vector|vectora|vectorr|vectorw|xlate|zip|zone)\\b"

    # annotations - LEAVE HERE to avoid clashing with KEYWORDS above
    - preproc: "@[A-Za-z_][A-Za-z0-9_.]*"

    # Block Comment
    - comment.block:
        start: "/\\*"
        end: "\\*/"
        rules:
            - todo: "(TODO|XXX|FIXME):?"

    # Doc Comment
    - comment.doc:
        start: "/\\*\\*"
        end: "\\*/"
        rules:
            - todo: "(TODO|XXX|FIXME):?"

    # Line Comment
    - comment.line:
        start: "--"
        end: "$"
        rules:
            - todo: "(TODO|XXX|FIXME):?"

    # Todo
    - todo: "(TODO|XXX|FIXME):?"

